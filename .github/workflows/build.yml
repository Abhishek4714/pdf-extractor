name: Build Executables

on: [push]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pymupdf pandas openpyxl pyinstaller
      - run: pyinstaller --onefile read_pdf_highlights_FINAL.py
      - uses: actions/upload-artifact@v4
        with:
          name: mac-executable
          path: dist/read_pdf_highlights_FINAL
